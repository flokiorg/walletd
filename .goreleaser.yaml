version: 2

project_name: walletd

before:
  hooks:
    - go mod download

builds:
  # main.appVersion is a plain var precisely so it can be set here; there is no
  # hand-edited version constant left to drift out of step with the
  # released tag.
  - id: walletd
    main: .
    binary: walletd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.appVersion={{ .Version }} -X main.appBuild={{ .ShortCommit }}
    # The platform set the previous release tooling shipped, kept
    # target for target so no published platform is dropped.
    targets: &targets
      - darwin_amd64
      - darwin_arm64
      - dragonfly_amd64
      - freebsd_386
      - freebsd_amd64
      - freebsd_arm_6
      - illumos_amd64
      - linux_386
      - linux_amd64
      - linux_arm64
      - linux_mips
      - linux_mips64
      - linux_mips64le
      - linux_mipsle
      - linux_ppc64
      - linux_ppc64le
      - netbsd_386
      - netbsd_amd64
      - netbsd_arm_6
      - netbsd_arm64
      - openbsd_386
      - openbsd_amd64
      - openbsd_arm_6
      - openbsd_arm64
      - solaris_amd64
      - windows_386
      - windows_amd64

archives:
  # One archive per binary per platform, matching the asset names the
  # previous tooling produced so existing download URLs keep their
  # shape: <name>-<os>-<arch>-v<version>.tar.gz (.zip on Windows).
  - id: walletd
    ids:
      - walletd
    name_template: "walletd-{{ .Os }}-{{ .Arch }}-v{{ .Version }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE


checksum:
  name_template: checksums.txt

release:
  github:
    owner: flokiorg
    name: walletd
  # Re-running a release replaces the assets rather than erroring.
  mode: replace
  # A version with a pre-release suffix is published as a GitHub prerelease.
  prerelease: auto

# Deliberately no `changelog:` block. GoReleaser loads --release-notes through
# the same pipe it uses for changelog generation, so disabling that pipe
# silently publishes an empty release body. The notes come from CHANGELOG.md via
# --release-notes in .github/workflows/release.yml.
